/a><span>·</span><span>© 2026 DevKit</span></footer><script>
'use strict';
function doDiff(){const l=document.getElementById('diff-left').value;const r=document.getElementById('diff-right').value;const linesL=l.split('\n');const linesR=r.split('\n');const max=Math.max(linesL.length,linesR.length);let added=0,removed=0;let html='';for(let i=0;i<max;i++){const ll=linesL[i]||'';const rr=linesR[i]||'';if(ll===rr){html+=`<div style="padding:2px 8px">  ${(i+1).toString().padStart(4)}  ${escapeHtml(ll)}</div>`}else{if(ll&&!rr){html+=`<div style="padding:2px 8px;background:#da363320;color:#f85149">- ${(i+1).toString().padStart(4)}  ${escapeHtml(ll)}</div>`;removed++}else if(!ll&&rr){html+=`<div style="padding:2px 8px;background:#23863620;color:#3fb950">+ ${(i+1).toString().padStart(4)}  ${escapeHtml(rr)}</div>`;added++}else{html+=`<div style="padding:2px 8px;background:#da363320;color:#f85149">- ${(i+1).toString().padStart(4)}  ${escapeHtml(ll)}</div>`;html+=`<div style="padding:2px 8px;background:#23863620;color:#3fb950">+ ${(i+1).toString().padStart(4)}  ${escapeHtml(rr)}</div>`;removed++;added++}}}document.getElementById('diff-result').innerHTML=html;document.getElementById('diff-stats').textContent=`+${added} -${removed}`}function swapDiff(){const l=document.getElementById('diff-left').value;document.getElementById('diff-left').value=document.getElementById('diff-right').value;document.getElementById('diff-right').value=l}function escapeHtml(t){const d=document.createElement('div');d.textContent=t;return d.innerHTML}
